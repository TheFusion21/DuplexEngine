name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux-vulkan:
    name: Linux (Vulkan)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Provides both the Vulkan SDK (headers/loader, used by driver.vulkan) and dxc, which
      # res/CMakeLists.txt uses to compile the HLSL shaders to SPIR-V.
      - name: Install Vulkan SDK (includes dxc)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # The SDK only provides the loader, not a driver. GitHub's runners have no GPU, so
      # vkCreateInstance/vkEnumeratePhysicalDevices need a software ICD to find anything -
      # Mesa's llvmpipe (lavapipe) fills that role headlessly.
      - name: Install software Vulkan driver (lavapipe)
        run: sudo apt-get install -y mesa-vulkan-drivers

      # engine.spirv (the vendored SPIRV-Cross submodule) declares a cmake_minimum_required
      # far below what current CMake still accepts; CMAKE_POLICY_VERSION_MINIMUM is CMake's
      # own documented escape hatch for exactly this (set externally, not in our CMakeLists.txt
      # - see https://cmake.org/cmake/help/latest/variable/CMAKE_POLICY_VERSION_MINIMUM.html).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  windows-d3d-vulkan:
    name: Windows (D3D11 / D3D12 / Vulkan)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Full LunarG Vulkan SDK - it also bundles dxc.exe, which res/CMakeLists.txt needs to
      # compile the HLSL shaders to SPIR-V. NOTE: the version must be one LunarG actually
      # published a Windows installer for - 1.3.268.0 (matched to the Linux job's Ubuntu
      # package) turned out to be an Ubuntu-packaging-only RC that was never released as a
      # Windows build (404). 1.3.296.0 is confirmed to exist for Windows.
      - name: Install Vulkan SDK (includes dxc)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Add dxc to PATH
        shell: pwsh
        run: |
          $dxcDir = "$env:VULKAN_SDK\Bin"
          if (-not (Test-Path "$dxcDir\dxc.exe")) {
            throw "dxc.exe not found under $dxcDir - Vulkan SDK layout may have changed."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dxcDir

      - name: Configure
        run: cmake -S . -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Debug

      # test_vulkan_bringup needs a real Vulkan ICD (GPU driver or software rasterizer),
      # which GitHub's Windows runners don't provide, so it's excluded here. The other two
      # tests are pure logic and run fine headless.
      - name: Test
        working-directory: build
        run: ctest -C Debug --output-on-failure -E vulkan_bringup
